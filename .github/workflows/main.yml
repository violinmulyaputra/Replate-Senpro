name: Replate CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore backend/Replate.Api.Tests/Replate.Api.Tests.csproj

      - name: Build
        run: dotnet build backend/Replate.Api/Replate.Api.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test backend/Replate.Api.Tests/Replate.Api.Tests.csproj --configuration Release --no-restore

      - name: Verify database migration
        env:
          ConnectionStrings__DefaultConnection: Server=localhost;Database=Replate;Integrated Security=True;TrustServerCertificate=True
          Jwt__Key: ci-only-key-that-is-at-least-32-characters-long
        run: >-
          dotnet ef migrations has-pending-model-changes --project backend/Replate.Api
          --startup-project backend/Replate.Api --configuration Release --no-build
